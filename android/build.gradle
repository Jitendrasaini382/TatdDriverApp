buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
        allprojects {
    repositories {
        maven {
              url = uri('https://api.mapbox.com/downloads/v2/releases/maven')
              authentication { basic(BasicAuthentication) }
              credentials {
                // Do not change the username below.
                // This should always be `mapbox` (not your username).
                  username = "mapbox"
                  // Use the secret token you stored in gradle.properties as the password
                //   password = project.hasProperty('MAPBOX_DOWNLOADS_TOKEN') ?: ""
                 password = providers.gradleProperty("MAPBOX_DOWNLOADS_TOKEN").getOrNull()
                   ?: System.getenv("MAPBOX_DOWNLOADS_TOKEN")
              }
          }
    }
}
        
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'  // firebase crashanylitics

    }
}

apply plugin: "com.facebook.react.rootproject"
